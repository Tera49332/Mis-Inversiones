<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Chart bars -->
  <rect x="100" y="320" width="60" height="100" rx="8" fill="rgba(255,255,255,0.25)"/>
  <rect x="180" y="260" width="60" height="160" rx="8" fill="rgba(255,255,255,0.35)"/>
  <rect x="260" y="200" width="60" height="220" rx="8" fill="rgba(255,255,255,0.45)"/>
  <rect x="340" y="160" width="60" height="260" rx="8" fill="rgba(255,255,255,0.6)"/>
  <!-- Trending arrow -->
  <path d="M120 280 L260 180 L340 220 L400 120" stroke="url(#arrow)" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="390,100 415,115 400,135" fill="white"/>
  <!-- Euro symbol -->
  <text x="415" y="400" font-family="Inter, sans-serif" font-size="80" font-weight="700" fill="rgba(255,255,255,0.9)">€</text>
</svg>